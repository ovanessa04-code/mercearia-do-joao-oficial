<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/static/" />
    <title>Clientes | Mercearia</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <div>
          <p class="eyebrow">Mercearia</p>
          <h1>Clientes</h1>
        </div>
        <button id="recarregar" class="button button-secondary" type="button">
          Recarregar
        </button>
      </header>

      <p id="mensagem" class="message" role="status" aria-live="polite"></p>

      <section class="card" aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario">Novo cliente</h2>

        <form id="cliente-form">
          <div class="form-grid">
            <label>
              Nome
              <input
                id="nome_cliente"
                name="nome_cliente"
                type="text"
                maxlength="150"
                required
              />
            </label>

            <label>
              Data de nascimento
              <input
                id="data_nascimento"
                name="data_nascimento"
                type="date"
                required
              />
            </label>

            <label class="field-small">
              Limite
              <input
                id="valor_limite"
                name="valor_limite"
                type="number"
                min="0"
                step="0.01"
                required
              />
            </label>
          </div>

          <div class="form-actions">
            <button id="salvar" class="button" type="submit">Salvar</button>
            <button
              id="cancelar-edicao"
              class="button button-secondary"
              type="button"
              hidden
            >
              Cancelar edição
            </button>
          </div>
        </form>
      </section>

      <section class="card" aria-labelledby="titulo-lista">
        <h2 id="titulo-lista">Clientes cadastrados</h2>

        <div class="table-wrapper">
          <table>
            <caption class="sr-only">Lista de clientes cadastrados</caption>
            <thead>
              <tr>
                <th scope="col">Nome</th>
                <th scope="col">Nascimento</th>
                <th scope="col">Limite</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="clientes-lista"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
